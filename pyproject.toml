[project]
name = "theone"
version = "2026.11.7.3"
description = "A Python port of neo: the digital rain from \"The Matrix\" in your terminal"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "nogard", email = "nogard@ucsc.edu" }]
requires-python = ">=3.11,<3.16"
dependencies = [
	"cyclopts>=5.3"
]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Terminals",
    "Topic :: Games/Entertainment",
]

[project.urls]
"Homepage" = "https://github.com/travisseymour/theone"

[project.scripts]
neo = "theone.cli:run"
theone = "theone.cli:run"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
